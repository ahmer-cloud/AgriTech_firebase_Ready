<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTech - Select Crop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2D6A4F;
            --accent-green: #52B788;
            --dark-bg: #0B1912;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-light: #F4F7F5;
            --text-muted: #B0C4B1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body { overflow-x: hidden;
            background: linear-gradient(135deg, #0B1912 0%, #1B4332 50%, #2D6A4F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            padding: 1.5rem 1rem;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            color: #fff;
        }

        .header-title span {
            color: var(--accent-green);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* 2x2 Fixed Symmetrical Grid */
        .crop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            width: 100%;
        }

        .crop-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.25rem 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .crop-card:hover {
            border-color: var(--accent-green);
            background: rgba(82, 183, 136, 0.16);
            transform: translateY(-5px);
            box-shadow: 0 16px 32px rgba(0,0,0,0.45);
        }

        /* Image Frame */
        .image-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 22px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            background: #14291e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crop-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .crop-card:hover .crop-img {
            transform: scale(1.08);
        }

        /* High-Legibility Visual Titles */
        .crop-label {
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: center;
        }

        .crop-label .en-title {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.3px;
        }

        .crop-label .ur-title {
            font-size: 0.95rem;
            color: var(--accent-green);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">Select Your <span>Active Crop</span></h1>
        <p class="subtitle">اپنی فعال فصل منتخب کریں</p>

        <div class="crop-grid">
            <!-- 1. Wheat -->
            <a href="05_dashboard.html" class="crop-card" onclick="selectCrop('Wheat', event)">
                <div class="image-wrapper">
                    <img src="../Images/Wheat.jpeg" class="crop-img" alt="Wheat (گندم)">
                </div>
                <div class="crop-label">
                    <span class="en-title">Wheat</span>
                    <span class="ur-title">(گندم)</span>
                </div>
            </a>

            <!-- 2. Cotton -->
            <a href="05_dashboard.html" class="crop-card" onclick="selectCrop('Cotton', event)">
                <div class="image-wrapper">
                    <img src="../Images/Cotton.jpeg" class="crop-img" alt="Cotton (کپاس)">
                </div>
                <div class="crop-label">
                    <span class="en-title">Cotton</span>
                    <span class="ur-title">(کپاس)</span>
                </div>
            </a>

            <!-- 3. Maize -->
            <a href="05_dashboard.html" class="crop-card" onclick="selectCrop('Maize', event)">
                <div class="image-wrapper">
                    <img src="../Images/Maize.jpeg" class="crop-img" alt="Maize (مکئی)">
                </div>
                <div class="crop-label">
                    <span class="en-title">Maize</span>
                    <span class="ur-title">(مکئی)</span>
                </div>
            </a>

            <!-- 4. Sugarcane -->
            <a href="05_dashboard.html" class="crop-card" onclick="selectCrop('Sugarcane', event)">
                <div class="image-wrapper">
                    <img src="../Images/Sugarcane.jpeg" class="crop-img" alt="Sugarcane (گنا)">
                </div>
                <div class="crop-label">
                    <span class="en-title">Sugarcane</span>
                    <span class="ur-title">(گنا)</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        function selectCrop(crop, event) {
            if (event) event.preventDefault();
            // Store crop choice cleanly in local storage
            localStorage.setItem('selectedCrop', crop);
            // Navigate directly to dashboard with query parameter fallback
            window.location.href = '05_dashboard.html?crop=' + encodeURIComponent(crop);
        }
    </script>
    <script type="module" src="firebase-init.js"></script>
    <script src="auth-guard.js"></script>
</body>
</html>
