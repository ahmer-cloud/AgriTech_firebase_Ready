<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPak - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* (Yahan aapka purana CSS design mojud hai, usko mat chheriye ga) */
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo-badge">
                <img src="../Images/Logo.jpeg" alt="AgriPak logo" onerror="this.src='../Images/Logo.png'">
            </div>
            <div class="brand-wordmark">Agr<span class="i-leaf">ı</span><span class="pak-text">Pak</span></div>
            <h2>Welcome Back</h2>
            <p>Sign in to continue to AgriPak</p>
        </div>

        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4M20,8L12,13L4,8V6L12,11L20,6V8Z"/></svg>
                    <input type="email" id="email" placeholder="farmer@agripak.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15C10,13.89 10.9,13 12,13M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.9 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/></svg>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="03.1_forgot_password.html" class="forgot-pass">Forgot Password?</a>
            </div>

            <span class="error-text" id="signinServerError" style="display:none; color: var(--error-red); font-size: 0.85rem; margin-top: -0.6rem;"></span>

            <button type="submit" class="submit-btn">Sign In &rarr;</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="03_signup.html">Sign Up</a>
        </div>
    </div>

    <script type="module" src="firebase-init.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const SELECT_CROP_PAGE = '04_select_crop.html';
            const errorBox = document.getElementById('signinServerError');
            const submitBtn = loginForm.querySelector('.submit-btn');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.style.display = 'none';
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                if (!email || !password) return;

                // === DEBUG LOG ===
                console.log("👉 SIGN-IN DATA -> Email:", email, "Password:", password);

                submitBtn.disabled = true;
                const originalLabel = submitBtn.innerHTML;
                submitBtn.innerHTML = 'Signing in...';

                try {
                    await window.agri.signIn(email, password);
                    window.location.href = SELECT_CROP_PAGE;
                } catch (err) {
                    errorBox.textContent = window.agri.friendlyError(err);
                    errorBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalLabel;
                }
            });
        });
    </script>
</body>
</html>
